<div class="modal-header">
  <h5 class="modal-title">Edit Comment</h5>
  <button type="button" class="close" (click)="onNoClick()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="form-group">
    <textarea class="form-control full-width" [(ngModel)]="commentContent"></textarea>
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="onNoClick()">Cancel</button>
  <button type="button" class="btn btn-primary" (click)="updateComment()">Update</button>
</div>
