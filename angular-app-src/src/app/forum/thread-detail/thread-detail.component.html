<div class="container pt-5">
  <div class="mt-5 pt-5">
    <h4>{{thread?.title}}</h4>
    <p>{{thread?.description}}</p>
    <div *ngFor="let post of posts" class="col-lg-12 forum pt-3">
      <div class="col-lg-12">
        <h6>{{post.content}}</h6>
        <a class="px-2" *ngIf="loggedInUser" (click)="reportComment(post.id)">Report</a>
        <a class="px-2" *ngIf="loggedInUser && (loggedInUser.roles.includes('moderator') || loggedInUser.roles.includes('admin'))" (click)="deleteComment(post.id)">Delete</a>
        <a class="px-2" *ngIf="loggedInUser && (loggedInUser.roles.includes('moderator') || loggedInUser.roles.includes('admin'))" (click)="editComment(post.id, thread?.id!, post.content)">Edit</a>
        <!-- if status is AWAITING_MODERATION, show button to resolve moderation if user is a moderator -->
        <a class="px-2" *ngIf="loggedInUser && loggedInUser.roles.includes('moderator') && post.status === 'AWAITING_MODERATION'" (click)="resolveModeration(post.id)">Resolve Moderation</a>
        <sub class="float-right">{{post?.createdByEmail}} on {{post?.lastUpdatedAt}}</sub>
      </div>
    </div>
    <div class="pt-3">
      <a class="px-2" *ngIf="loggedInUser" (click)="replyThread(thread?.id)">Comment</a>
      <a class="px-2 float-right" routerLink="../../">Back</a>
    </div>
  </div>
</div>
