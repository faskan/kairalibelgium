<div class="container mt-4">
  <div class="row mt-4" *ngIf="selectedEventId">
    <div class="col-md-8">
      <h3>Program Schedules</h3>
      <div cdkDropList class="list-group" (cdkDropListDropped)="onDrop($event)">
        <div class="list-group-item" *ngFor="let schedule of schedules" cdkDrag>
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h5>{{ schedule.title }}</h5>
              <p class="mb-1">Contact: {{ schedule.contactPerson }}</p>
              <small>Scheduled Time: {{ schedule.scheduledTime | date:'short' }}</small><br>
              <small>Status: {{ schedule.status }}</small><br>
              <small>Duration: {{ schedule.durationInMinutes }} mins</small>
            </div>
            <div>
              <button class="btn btn-primary btn-sm" (click)="onEditSchedule(schedule)">Edit</button>
              <button class="btn btn-danger btn-sm" (click)="onDeleteSchedule(schedule.id)">Delete</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <h3>{{ editing ? 'Edit' : 'Add' }} Schedule</h3>
      <form (ngSubmit)="onSubmit()" #scheduleForm="ngForm">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" class="form-control" [(ngModel)]="scheduleModel.title" name="title" required />
        </div>
        <div class="form-group">
          <label for="contactPerson">Contact Person</label>
          <input type="text" id="contactPerson" class="form-control" [(ngModel)]="scheduleModel.contactPerson" name="contactPerson" required />
        </div>
        <div class="form-group">
          <label for="scheduledTime">Scheduled Time</label>
          <input type="datetime-local" id="scheduledTime" class="form-control" [(ngModel)]="scheduleModel.scheduledTime" name="scheduledTime" required />
        </div>
        <div class="form-group">
          <label for="status">Status</label>
          <input type="text" id="status" class="form-control" [(ngModel)]="scheduleModel.status" name="status" required />
        </div>
        <div class="form-group">
          <label for="duration">Duration (minutes)</label>
          <input type="number" id="duration" class="form-control" [(ngModel)]="scheduleModel.durationInMinutes" name="duration" required />
        </div>
        <button type="submit" class="btn btn-success" [disabled]="!scheduleForm.form.valid">{{ editing ? 'Update' : 'Add' }} Schedule</button>
      </form>
    </div>
  </div>
</div>
