<div class="container mt-4">
  <div class="row mt-4" *ngIf="selectedEventId">
    <div class="col-md-12">
      <h3>Program Schedules</h3>
      <div class="list-group">
        <div class="list-group-item d-flex" *ngFor="let schedule of schedules; let i = index">
          <div class="time-info text-center">
            <span class="time-index">{{ schedule.scheduledTime | date:'HH:mm' }}</span><br>
            <span class="duration">{{ schedule.durationInMinutes }} mins</span>
          </div>
          <div class="schedule-info flex-grow-1">
            <h5>{{ schedule.title }}</h5>
            <p class="mb-1">Contact: {{ schedule.contactPerson }}</p>
            <span class="badge" [ngClass]="getStatusClass(schedule.status)">{{ schedule.status }}</span>
          </div>
          <div class="align-self-center d-flex">
            <button class="btn btn-link icon-btn" (click)="moveScheduleUp(i)" [disabled]="i === 0">
              <i class="fas fa-arrow-up"></i>
            </button>
            <button class="btn btn-link icon-btn" (click)="moveScheduleDown(i)" [disabled]="i === schedules.length - 1">
              <i class="fas fa-arrow-down"></i>
            </button>
            <button class="btn btn-link icon-btn" (click)="onEditSchedule(schedule)">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-link icon-btn text-danger" (click)="onDeleteSchedule(schedule.id)">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
